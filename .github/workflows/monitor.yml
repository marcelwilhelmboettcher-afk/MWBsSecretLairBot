name: Secret Lair Tracker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: secret-lair-tracker
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Tracker ausfuehren
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Ergebnisse committen (state.json, secret_lairs.json, calendar.ics)
        run: |
          git config user.name "secret-lair-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json secret_lairs.json docs/calendar.ics
          git diff --staged --quiet || git commit -m "Update Secret Lair data [skip ci]"
          git pull --rebase origin main
          git push
