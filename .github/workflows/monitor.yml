      - name: Ergebnisse committen (state.json, secret_lairs.json, calendar.ics)
        run: |
          git config user.name "secret-lair-tracker-bot"
          git config user.email "actions@users.noreply.github.com"

          cp state.json /tmp/state.json
          cp secret_lairs.json /tmp/secret_lairs.json
          cp docs/calendar.ics /tmp/calendar.ics

          for i in 1 2 3 4 5; do
            git add state.json secret_lairs.json docs/calendar.ics
            if git diff --staged --quiet; then
              echo "Nichts zu committen."
              break
            fi
            git commit -m "Update Secret Lair data [skip ci]"

            if git push; then
              echo "Push erfolgreich."
              break
            fi

            echo "Push fehlgeschlagen (Versuch $i), synchronisiere und versuche erneut..."
            git fetch origin main
            git reset --hard origin/main

            cp /tmp/state.json state.json
            cp /tmp/secret_lairs.json secret_lairs.json
            mkdir -p docs
            cp /tmp/calendar.ics docs/calendar.ics
          done

Zu deiner Frage: Nein, Bot-Name und E-Mail müssen nicht "echt" oder irgendwo registriert sein. Das sind reine Metadaten für den Git-Commit (wer steht als Autor im Log) – GitHub prüft nicht, ob dieser Name/diese Adresse existiert. "secret-lair-tracker-bot" und "actions@users.noreply.github.com" funktionieren ohne weitere Einrichtung, das war schon vorher in eurem Workflow so und ist unverändert geblieben.

Nochmal zum Einfügen: Lösch den alten letzten Schritt komplett, klick in eine leere Zeile ganz links (keine Einrückung), und füge den Block oben ein. Falls dein Editor die Einrückung trotzdem verschiebt, sag mir kurz, wie viele Leerzeichen bei - name: und run: jeweils tatsächlich stehen (du kannst das mit den Pfeiltasten/Cursor abzählen), dann justieren wir das gezielt.

