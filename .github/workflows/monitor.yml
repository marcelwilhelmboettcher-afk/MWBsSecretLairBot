name: Secret Lair Tracker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: secret-lair-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Tracker ausfuehren
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python monitor.py

      - name: Ergebnisse committen (state.json, secret_lairs.json, calendar.ics)
        run: |
          git config user.name "secret-lair-tracker-bot"
          git config user.email "actions@users.noreply.github.com"

          cp state.json /tmp/state.json
          cp secret_lairs.json /tmp/secret_lairs.json
          cp docs/calendar.ics /tmp/calendar.ics

          for i in 1 2 3 4 5; do
            git add state.json secret_lairs.json docs/calendar.ics
            if git diff --staged --quiet; then
              echo "Nichts zu committen."
              break
            fi
            git commit -m "Update Secret Lair data"

            if git push; then
              echo "Push erfolgreich."
              break
            fi

            echo "Push fehlgeschlagen (Versuch $i), synchronisiere und versuche erneut..."
            git fetch origin main
            git reset --hard origin/main

            cp /tmp/state.json state.json
            cp /tmp/secret_lairs.json secret_lairs.json
            mkdir -p docs
            cp /tmp/calendar.ics docs/calendar.ics
          done
